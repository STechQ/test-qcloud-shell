<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="stylesheet" href='cdn/fonts.googleapis.com/css2/Roboto-d92af69e.css' />
    <link rel="stylesheet" href="cdn/cdn.jsdelivr.net/npm/@mdi/font@6.6.96/css/materialdesignicons.min.css" />
    <style>
      @import url('cdn/fonts.googleapis.com/css2/Roboto-ad97656d.css');
    </style>
  </head>
  <body>
    <div id="dataTypeEditorRoot"></div>
    <script src="program.js"></script>
    <script>
      document.addEventListener("keydown", function (event) {
        if ((event.ctrlKey || event.metaKey) && (event.key.toLowerCase() === "z" || event.key.toLowerCase() === "y")) {
          event.preventDefault();
          window.parent.parent.postMessage({ type: "keydown", key: event.key.toLowerCase(), ctrl: event.ctrlKey , cmd: event.metaKey }, "*");
        }
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Plateau Studio</title>
  <script>
    var baseObject = (() => {
      const obj = {
        "localhost": { basePath: "/", envName: "local" },
        "127.0.0.1": { basePath: "/", envName: "local" },
        "cloudapp.azure.com": { basePath: "/", envName: "cloud" },
        "github.io": { basePath: "/test-qcloud-shell/", envName: "cloud" },
        "azurestaticapps.net": { basePath: "/", envName: "cloud" },
        "studio.onplateau.com": { basePath: "/", envName: "prod" },
        "studiolegacy.onplateau.com": { basePath: "/", envName: "prod" },
        "plateaustudio.kube.devisbank": { basePath: "/", envName: "onPrem" },
        "plateaustudioworkflow.kube.devisbank": { basePath: "/", envName: "onPremWf" }
      };
      const host = new URL(window.location.href).hostname;
      if(host.includes("yellow-glacier")) {
        return { basePath: "/", envName: "prod" };
      }
      return obj[Object.keys(obj).find(key => host.endsWith(key))];
    })();

    var getBaseUrl = () => window.location.origin + baseObject.basePath;
    var getBasePath = () => baseObject.basePath;
    var getBaseEnv = () => baseObject.envName;

    // former cdn files are served from our own "cdn/<host>/<path>" copy (src/presentation/cdn); written synchronously to keep the original load order
    var cdnUrl = (path) => baseObject.basePath + "cdn/" + path;
    document.write('<link rel="stylesheet" href="' + cdnUrl("cdn.jsdelivr.net/npm/@mdi/font@6.6.96/css/materialdesignicons.min.css") + '" />');
    document.write('<link rel="stylesheet" href="' + cdnUrl("cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css") + '" />');
    document.write('<script src="' + cdnUrl("cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js") + '"><\/script>');
  </script>
  <!-- <link rel="stylesheet" href='https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap' /> -->
  <link rel="icon" href="images/iconplateau.png" />
  <style>
    body {
      margin: 0px;
      overflow: hidden;
    }

    #app {
      height: 100vh;
    }
  </style>
  <script>
    // fonts.googleapis.com css (Inter, Lato, Montserrat, Nunito, Open Sans, Oswald, Poppins, Raleway, Roboto, Rubik, Source Sans Pro); its fonts.gstatic.com urls are rewritten to the local copy
    document.write('<link rel="stylesheet" href="' + cdnUrl("fonts.googleapis.com/css2/Inter_Lato_Montserrat_Nunito_OpenSans_Oswald_Poppins_Raleway_Roboto_Rubik_SourceSansPro-7c6421b1.css") + '" />');
  </script>
</head>

<body>
  <div id="app"></div>
  <script>
    //placeholder: 404.html
    // baseObject, getBaseUrl, getBasePath and getBaseEnv are defined in <head> (needed there for the local cdn urls)
    var includeJS = (path) => {
      if (Array.from(document.querySelectorAll("body > script")).find(script => script.src.endsWith(path))) { return; }
      var script = document.createElement("script");
      script.src = path;
      document.body.appendChild(script);
    };
    var includeSso = () => includeJS(baseObject.basePath + "sso.js");
    var includeProgram = () => includeJS(baseObject.basePath + "program.js?v=3.4.0-0");

    (() => {
      includeSso();
    })();
  </script>
